# Engly backend (Spring Boot). Flyway applies V1+V2 on startup against the postgres Service.
# Image is built locally into OrbStack's shared store; IfNotPresent avoids a registry pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engly-be
  namespace: engly
  labels:
    app: engly-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engly-be
  template:
    metadata:
      labels:
        app: engly-be
    spec:
      containers:
        - name: engly-be
          image: engly-be:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/engly
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_PASSWORD
            # App-issued JWT signing secret (HS256, HMAC-SHA256). Optional: if the secret is absent
            # the app generates an EPHEMERAL random key at startup — tokens drop on every restart
            # (which logs users out). Provide a fixed JWT_SECRET so sessions survive restarts.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: engly-jwt-secret
                  key: JWT_SECRET
                  optional: true
            # The NodePort serves plain HTTP → Secure cookies would be dropped by the browser.
            # Set "true" only once the SPA/API are served behind TLS.
            - name: AUTH_COOKIE_SECURE
              value: "false"
            # SPA origin the social-login handshake redirects back to. Must be the exact browser origin;
            # provider OAuth redirect URIs are registered as {FRONTEND_URL}/login/oauth2/code/{provider}.
            - name: FRONTEND_URL
              value: http://localhost:4200
            # Social login (optional). Both blank → provider disabled; app boots password-only.
            # Store real credentials in a Secret (engly-oauth-secret), never inline. Uncomment to enable.
            # - name: GOOGLE_CLIENT_ID
            #   valueFrom: { secretKeyRef: { name: engly-oauth-secret, key: GOOGLE_CLIENT_ID, optional: true } }
            # - name: GOOGLE_CLIENT_SECRET
            #   valueFrom: { secretKeyRef: { name: engly-oauth-secret, key: GOOGLE_CLIENT_SECRET, optional: true } }
            # - name: FACEBOOK_CLIENT_ID
            #   valueFrom: { secretKeyRef: { name: engly-oauth-secret, key: FACEBOOK_CLIENT_ID, optional: true } }
            # - name: FACEBOOK_CLIENT_SECRET
            #   valueFrom: { secretKeyRef: { name: engly-oauth-secret, key: FACEBOOK_CLIENT_SECRET, optional: true } }
            # Avatar S3 storage (Floci emulator on the host, docker compose --profile floci).
            # Same browser-vs-server split as the OIDC URIs above:
            #  - S3_ENDPOINT is the backend's own calls (HeadObject) → pod reaches the host-
            #    published port via OrbStack's host alias.
            #  - S3_PUBLIC_ENDPOINT is baked into presigned URLs the BROWSER hits; the signature
            #    is host-specific, so it must be exactly the origin the user's browser can reach.
            # test/test are the emulator's public dummy creds — use a Secret for real AWS.
            - name: S3_ENDPOINT
              value: http://host.orb.internal:4566
            - name: S3_PUBLIC_ENDPOINT
              value: http://localhost:4566
            - name: AVATAR_BUCKET
              value: engly-avatars
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            # SMTP for account-activation emails. Prod needs a real relay (e.g. SES-SMTP) and a
            # verified MAIL_FROM sender/domain — without this, every registration silently loses
            # its activation email. Creds come from a Secret, never inline.
            - name: MAIL_HOST
              value: localhost
            - name: MAIL_PORT
              value: "1025"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: engly-mail-secret
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engly-mail-secret
                  key: MAIL_PASSWORD
                  optional: true
            - name: MAIL_SMTP_AUTH
              value: "false"
            - name: MAIL_SMTP_STARTTLS
              value: "false"
            - name: MAIL_FROM
              value: no-reply@engly.local
            # Email activation on registration. Set to "false" to instantly roll back to the
            # pre-feature flow (immediate session on register, no login gate) without a redeploy.
            - name: EMAIL_VERIFICATION_ENABLED
              value: "true"
            - name: EMAIL_VERIFICATION_TTL
              value: 24h
            - name: EMAIL_VERIFICATION_RESEND_COOLDOWN
              value: 60s
          # startupProbe gates liveness/readiness until the app has booted (Flyway + JPA),
          # giving up to ~150s on cold start before liveness can ever fire — prevents the
          # boot-time restart loop seen with an aggressive livenessProbe.
          startupProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: engly-be
  namespace: engly
spec:
  selector:
    app: engly-be
  ports:
    - port: 8081
      targetPort: 8081
