# Engly backend (Spring Boot). Flyway applies V1+V2 on startup against the postgres Service.
# Image is built locally into OrbStack's shared store; IfNotPresent avoids a registry pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engly-be
  namespace: engly
  labels:
    app: engly-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engly-be
  template:
    metadata:
      labels:
        app: engly-be
    spec:
      containers:
        - name: engly-be
          image: engly-be:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/engly
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_PASSWORD
            # App-issued JWT signing secret (HS256, HMAC-SHA256). Optional: if the secret is absent
            # the app generates an EPHEMERAL random key at startup — tokens drop on every restart
            # (which logs users out). Provide a fixed JWT_SECRET so sessions survive restarts.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: engly-jwt-secret
                  key: JWT_SECRET
                  optional: true
            # The NodePort serves plain HTTP → Secure cookies would be dropped by the browser.
            # Set "true" only once the SPA/API are served behind TLS.
            - name: AUTH_COOKIE_SECURE
              value: "false"
            # Avatar S3 storage (Floci emulator on the host, docker compose --profile floci).
            # Same browser-vs-server split as the OIDC URIs above:
            #  - S3_ENDPOINT is the backend's own calls (HeadObject) → pod reaches the host-
            #    published port via OrbStack's host alias.
            #  - S3_PUBLIC_ENDPOINT is baked into presigned URLs the BROWSER hits; the signature
            #    is host-specific, so it must be exactly the origin the user's browser can reach.
            # test/test are the emulator's public dummy creds — use a Secret for real AWS.
            - name: S3_ENDPOINT
              value: http://host.orb.internal:4566
            - name: S3_PUBLIC_ENDPOINT
              value: http://localhost:4566
            - name: AVATAR_BUCKET
              value: engly-avatars
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
          # startupProbe gates liveness/readiness until the app has booted (Flyway + JPA),
          # giving up to ~150s on cold start before liveness can ever fire — prevents the
          # boot-time restart loop seen with an aggressive livenessProbe.
          startupProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: engly-be
  namespace: engly
spec:
  selector:
    app: engly-be
  ports:
    - port: 8081
      targetPort: 8081
