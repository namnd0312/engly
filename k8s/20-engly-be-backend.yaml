# Engly backend (Spring Boot). Flyway applies V1+V2 on startup against the postgres Service.
# Image is built locally into OrbStack's shared store; IfNotPresent avoids a registry pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engly-be
  namespace: engly
  labels:
    app: engly-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engly-be
  template:
    metadata:
      labels:
        app: engly-be
    spec:
      containers:
        - name: engly-be
          image: engly-be:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/engly
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engly-db-secret
                  key: POSTGRES_PASSWORD
            # OIDC URIs are split by audience:
            #  - authorization-uri is BROWSER-facing → must be the host-reachable NodePort
            #    (localhost:30080), since the user's browser is redirected there.
            #  - token-uri / jwk-set-uri are SERVER-side calls made by engly-be itself →
            #    must use in-cluster Service DNS; localhost:30080 inside the pod is the pod's
            #    own loopback (nothing listens there) and the token exchange would fail,
            #    sending OAuth2 login to /login?error.
            - name: OAUTH2_OPENGATE_AUTH_URI
              value: http://localhost:30080/oauth2/authorize
            - name: OAUTH2_OPENGATE_TOKEN_URI
              value: http://open-gate-app.open-gate:8080/oauth2/token
            - name: OAUTH2_OPENGATE_JWKS_URI
              value: http://open-gate-app.open-gate:8080/oauth2/jwks
            # OPEN-GATE is now an SSO option only (not the token issuer). The app issues its OWN
            # JWTs; these OAUTH2_* vars drive the SSO authorization-code handshake + id_token
            # signature check (provider jwk-set-uri) during "Login with OpenGate".
            # Post-login / post-logout redirect target. Defaults in code to the dev server
            # (http://localhost:4200/); in k8s the SPA is served at the NodePort, so a
            # successful login must land back there, not on a dead :4200.
            - name: APP_FRONTEND_URL
              value: http://localhost:30090/
            # App-issued JWT signing keys (RSA, base64 DER / PEM body). Optional: if the secret
            # is absent the app generates an EPHEMERAL keypair at startup — fine for this single
            # replica (tokens drop on restart). Provide a real keypair before scaling replicas out.
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: engly-jwt-secret
                  key: JWT_PRIVATE_KEY
                  optional: true
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: engly-jwt-secret
                  key: JWT_PUBLIC_KEY
                  optional: true
            # The NodePort serves plain HTTP → Secure cookies would be dropped by the browser.
            # Set "true" only once the SPA/API are served behind TLS.
            - name: AUTH_COOKIE_SECURE
              value: "false"
          # startupProbe gates liveness/readiness until the app has booted (Flyway + JPA),
          # giving up to ~150s on cold start before liveness can ever fire — prevents the
          # boot-time restart loop seen with an aggressive livenessProbe.
          startupProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/verbs?size=1
              port: 8081
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: engly-be
  namespace: engly
spec:
  selector:
    app: engly-be
  ports:
    - port: 8081
      targetPort: 8081
