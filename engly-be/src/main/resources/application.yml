server:
  port: 8081
  tomcat:
    # tus sends GB-scale PATCH bodies; never cap how much Tomcat will swallow on connection close.
    max-swallow-size: -1
    # Allow long-lived connections for slow/large chunk uploads (30 min).
    connection-timeout: 1800000

# CSV bulk-import upload + processing tuning.
upload:
  storage:
    # Persistent volume in prod (survives restart → crash-resume holds); dev default ./data/uploads.
    path: ${UPLOAD_DIR:./data/uploads}
  # Hard cap on a single upload (2GB). Keep Tomcat/tus aligned with available disk.
  max-size: ${UPLOAD_MAX_SIZE:2147483648}

import:
  # Rows per atomic batch/checkpoint. 500 is conservative for 512MB heap; tune up to 1000 after profiling.
  batch-size: ${IMPORT_BATCH_SIZE:500}
  # A RUNNING job whose heartbeat is older than this is considered crashed → reclaimable by recovery.
  stale-heartbeat-seconds: ${IMPORT_STALE_HEARTBEAT_SECONDS:120}
  # How often the recovery sweeper scans for stale/orphaned jobs.
  sweeper-delay-ms: ${IMPORT_SWEEPER_DELAY_MS:90000}
  # Finalized files of COMPLETED jobs are deleted by the hourly cleanup after this many hours.
  completed-file-ttl-hours: ${IMPORT_COMPLETED_FILE_TTL_HOURS:24}

# Spring multipart is irrelevant to tus (application/offset+octet-stream is not multipart/*),
# so no multipart resolver intercepts the upload path; left at defaults intentionally.

app:
  security:
    # Name of the OIDC id_token claim carrying the user's roles (OPEN-GATE emits "roles").
    # Each value is mapped to a ROLE_<UPPERCASE> authority; "admin" → ROLE_ADMIN.
    roles-claim-name: ${ROLES_CLAIM_NAME:roles}

spring:
  datasource:
    # DB_URL overridable for k8s (points at the postgres Service); dev default = docker-compose :5433
    url: ${DB_URL:jdbc:postgresql://localhost:5433/engly}
    username: ${DB_USER:engly}
    password: ${DB_PASSWORD:engly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        # BFF (phase-05): Engly is a confidential OAuth2 client of the OPEN-GATE IdP.
        # Secret comes from the environment — NEVER commit a real one. Explicit provider
        # URIs (no issuer-uri) keep startup offline-safe: the IdP is only contacted during
        # an actual login, so the app boots even when the IdP is down.
        registration:
          opengate:
            client-id: ${OAUTH2_OPENGATE_CLIENT_ID:client-1634914a}
            client-secret: ${OAUTH2_OPENGATE_CLIENT_SECRET:e2eec131-7947-438e-a598-400810122fd2}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/opengate"
        provider:
          opengate:
            authorization-uri: ${OAUTH2_OPENGATE_AUTH_URI:http://localhost:30080/oauth2/authorize}
            token-uri: ${OAUTH2_OPENGATE_TOKEN_URI:http://localhost:30080/oauth2/token}
            jwk-set-uri: ${OAUTH2_OPENGATE_JWKS_URI:http://localhost:30080/oauth2/jwks}
            # IdP has NO /userinfo endpoint → identity is read from id_token claims.
            user-name-attribute: sub
      # Resource Server: /api/admin/** validates an OPEN-GATE Bearer JWT (stateless), verified
      # against the same JWK set. NimbusJwtDecoder fetches JWKs lazily on first use → boot stays
      # offline-safe. Used by both the SPA (token fetched via /api/token) and external clients.
      resourceserver:
        jwt:
          jwk-set-uri: ${OAUTH2_OPENGATE_JWKS_URI:http://localhost:30080/oauth2/jwks}
