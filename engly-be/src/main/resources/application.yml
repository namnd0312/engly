server:
  port: 8081
  tomcat:
    # tus sends GB-scale PATCH bodies; never cap how much Tomcat will swallow on connection close.
    max-swallow-size: -1
    # Allow long-lived connections for slow/large chunk uploads (30 min).
    connection-timeout: 1800000

# CSV bulk-import upload + processing tuning.
upload:
  storage:
    # Persistent volume in prod (survives restart → crash-resume holds); dev default ./data/uploads.
    path: ${UPLOAD_DIR:./data/uploads}
  # Hard cap on a single upload (2GB). Keep Tomcat/tus aligned with available disk.
  max-size: ${UPLOAD_MAX_SIZE:2147483648}

import:
  # Rows per atomic batch/checkpoint. 500 is conservative for 512MB heap; tune up to 1000 after profiling.
  batch-size: ${IMPORT_BATCH_SIZE:500}
  # A RUNNING job whose heartbeat is older than this is considered crashed → reclaimable by recovery.
  stale-heartbeat-seconds: ${IMPORT_STALE_HEARTBEAT_SECONDS:120}
  # How often the recovery sweeper scans for stale/orphaned jobs.
  sweeper-delay-ms: ${IMPORT_SWEEPER_DELAY_MS:90000}
  # Finalized files of COMPLETED jobs are deleted by the hourly cleanup after this many hours.
  completed-file-ttl-hours: ${IMPORT_COMPLETED_FILE_TTL_HOURS:24}

# Spring multipart is irrelevant to tus (application/offset+octet-stream is not multipart/*),
# so no multipart resolver intercepts the upload path; left at defaults intentionally.

# Avatar storage (S3). Defaults target the local Floci emulator (docker compose --profile floci);
# on real AWS leave endpoint/public-endpoint BLANK (SDK defaults) and use real credentials.
aws:
  region: ${AWS_REGION:us-east-1}
  # test/test = local emulator defaults. Blank on real AWS -> default credential provider chain.
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  s3:
    bucket: ${AVATAR_BUCKET:engly-avatars}
    # Server-side endpoint: the backend's own S3 calls (HeadObject). In k8s this is the
    # host-reachable emulator (http://host.orb.internal:4566), NOT localhost.
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    # Browser-facing endpoint: presigned PUT/GET URLs are signed for THIS host and the
    # signature is host-specific — it must be exactly the origin the user's browser hits
    # (same split as the OPEN-GATE authorization-uri vs token-uri precedent).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:4566}
    # Presigned PUT lifetime: S3 validates expiry when the request STARTS, so an
    # any-size upload that begins in time is allowed to finish.
    upload-url-ttl: ${AVATAR_UPLOAD_URL_TTL:15m}
    # Presigned GET lifetime for serving avatars via /api/me.
    download-url-ttl: ${AVATAR_DOWNLOAD_URL_TTL:1h}

app:
  # SPA origin the social-login handshake redirects back to (success → /, failure → /login?error=sso).
  # Must be the exact origin the browser uses; in dev that is the Angular dev server (:4200), same origin
  # the auth cookies are issued for. No trailing slash.
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # Google/Facebook OAuth2 credentials. Blank = that provider disabled; when BOTH are blank no OAuth2
  # login chain is created (app boots normally with password login only). Never commit real values.
  social-login:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook-client-id: ${FACEBOOK_CLIENT_ID:}
    facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:}
    facebook-api-version: ${FACEBOOK_API_VERSION:v19.0}
  security:
    jwt:
      # The app signs its OWN access tokens with HS256. Provide a fixed secret via env/secret
      # (JWT_SECRET) for prod/multi-instance; if absent an ephemeral random key is generated at
      # startup (dev only, tokens drop on restart).
      issuer: engly
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
      # JWT claim carrying the user's roles (Spring-form, e.g. ROLE_ADMIN). Sourced from the DB.
      roles-claim-name: ${ROLES_CLAIM_NAME:roles}
      cookie:
        access-name: ACCESS_TOKEN
        refresh-name: REFRESH_TOKEN
        refresh-path: /api/auth
        # Secure=true requires HTTPS — enable in prod (cookies dropped over plain HTTP otherwise).
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: Lax
    mfa:
      # AES-256-GCM key (any string, SHA-256-derived) protecting stored admin TOTP secrets. Blank =
      # ephemeral key at startup (dev only): after a restart enrolled admins are locked out until the
      # SQL reset in docs/deployment-guide.md.
      secret-key: ${MFA_SECRET_KEY:TQqQl3e4lKm9EmQapu4qy100dzZlkkCjTYDEZg6ScMwx0osY41O7hE3JxYL5MVi/}
      # Issuer label shown in authenticator apps.
      issuer: Engly
  # Email activation on registration. `enabled=false` is the rollback switch: register
  # auto-verifies + issues a session immediately (pre-feature behavior) and login is not gated.
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    token-ttl: ${EMAIL_VERIFICATION_TTL:24h}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
    from-address: ${MAIL_FROM:no-reply@engly.local}
    verify-path: /verify-email

spring:
  # SMTP for account-activation emails (dev default: Mailpit on localhost:1025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  datasource:
    # DB_URL overridable for k8s (points at the postgres Service); dev default = docker-compose :5433
    url: ${DB_URL:jdbc:postgresql://localhost:5433/engly}
    username: ${DB_USER:engly}
    password: ${DB_PASSWORD:engly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
