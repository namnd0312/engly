<header class="app-header">
  <span class="app-title">Engly — Irregular Verbs</span>

  <span class="app-auth">
    @if (isAuthenticated()) {
      @if (isAdmin()) {
        <button type="button" class="auth-btn" (click)="goToAdmin()">Admin</button>
      }
      <button type="button" class="auth-btn" (click)="goToStudy()">Học từ vựng</button>
      <button type="button" class="auth-btn" (click)="goToProfile()">Profile</button>
      <span class="app-user">{{ user()?.name || user()?.email || user()?.sub }}</span>
      <button type="button" class="auth-btn" (click)="logout()">Logout</button>
    } @else {
      <button type="button" class="auth-btn" (click)="goToLogin()">Đăng nhập</button>
    }
  </span>
</header>

<main class="app-main">
  <router-outlet />
</main>

<style>
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: #1a1a2e;
    color: #e2e8f0;
    padding: 0.85rem 1.5rem;
    font-family: system-ui, sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .app-auth {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .app-user {
    color: #cbd5e1;
  }

  .auth-btn {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.9rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .auth-btn:hover {
    background: #4338ca;
  }

  .app-main {
    min-height: calc(100vh - 48px);
    background: #f8fafc;
  }
</style>
