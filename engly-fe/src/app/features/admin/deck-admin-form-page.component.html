<section class="admin-form-page">
  <h1 class="page-title">{{ editId() === null ? 'New deck' : 'Edit deck' }}</h1>

  @if (serverError()) {
    <p class="state-msg error-msg" role="alert">{{ serverError() }}</p>
  }

  <form class="entity-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="name">Name *</label>
      <input id="name" type="text" formControlName="name" maxlength="120" />
      @if (form.get('name')?.touched && form.get('name')?.invalid) {
        <span class="field-error">Name is required (max 120 chars).</span>
      }
    </div>

    <div class="field">
      <label for="topic">Topic</label>
      <input id="topic" type="text" formControlName="topic" maxlength="80"
             placeholder="e.g. Animals, Travel…" />
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" maxlength="500" rows="3"
                placeholder="Optional short description…"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="primary-btn" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Saving…' : 'Save' }}
      </button>
      <button type="button" class="ghost-btn" (click)="cancel()">Cancel</button>
    </div>
  </form>
</section>

<style>
  .admin-form-page {
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
    font-family: system-ui, sans-serif;
  }

  .page-title {
    font-size: 1.75rem;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 1.25rem;
  }

  .state-msg {
    padding: 0.85rem 1rem;
    border-radius: 6px;
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  .error-msg { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }

  .entity-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .field label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #334155;
  }

  .field input[type='text'],
  .field textarea {
    padding: 0.55rem 0.75rem;
    font-size: 0.95rem;
    border: 2px solid #cbd5e1;
    border-radius: 6px;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
    resize: vertical;
  }

  .field input[type='text']:focus,
  .field textarea:focus {
    border-color: #6366f1;
  }

  .field-error {
    color: #b91c1c;
    font-size: 0.8rem;
  }

  .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }

  .primary-btn {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.55rem 1.2rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .primary-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
  .primary-btn:not(:disabled):hover { background: #4338ca; }

  .ghost-btn {
    background: none;
    border: 2px solid #cbd5e1;
    color: #475569;
    border-radius: 6px;
    padding: 0.5rem 1.1rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .ghost-btn:hover { border-color: #94a3b8; }
</style>
