# nginx config for the Engly frontend pod.
# Serves the Angular SPA and reverse-proxies /api to the backend k8s Service.
# Replaces the dev-only proxy.conf.json (which targets localhost:8081 during `ng serve`).
# Extract the port from the client's Host header ("localhost:30090" -> "30090";
# bare "localhost" -> "80") so it can be forwarded to engly-be as X-Forwarded-Port.
map $http_host $fwd_port {
    default              80;
    "~^[^:]+:(?<p>\d+)$" $p;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the engly-be ClusterIP Service (same namespace).
    location /api/ {
        proxy_pass http://engly-be:8081;
        proxy_http_version 1.1;
        # engly-be honors forwarded headers, so host AND port must both be forwarded.
        # $http_host carries host:port (e.g. localhost:30090); X-Forwarded-Port supplies
        # the port (via $fwd_port) so Spring builds redirect_uri = http://localhost:30090/...
        # Sending X-Forwarded-Proto WITHOUT X-Forwarded-Port made Spring reset the port to
        # 80, collapsing redirect_uri to http://localhost and breaking OIDC login.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $fwd_port;
    }

    # BFF OIDC login start (/oauth2/authorization/opengate) → engly-be.
    # Without this, the path SPA-falls-back to index.html and login never starts.
    location /oauth2/ {
        proxy_pass http://engly-be:8081;
        proxy_http_version 1.1;
        # engly-be honors forwarded headers, so host AND port must both be forwarded.
        # $http_host carries host:port (e.g. localhost:30090); X-Forwarded-Port supplies
        # the port (via $fwd_port) so Spring builds redirect_uri = http://localhost:30090/...
        # Sending X-Forwarded-Proto WITHOUT X-Forwarded-Port made Spring reset the port to
        # 80, collapsing redirect_uri to http://localhost and breaking OIDC login.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $fwd_port;
    }

    # OAuth2 callback (/login/oauth2/code/opengate) → engly-be.
    location /login/ {
        proxy_pass http://engly-be:8081;
        proxy_http_version 1.1;
        # engly-be honors forwarded headers, so host AND port must both be forwarded.
        # $http_host carries host:port (e.g. localhost:30090); X-Forwarded-Port supplies
        # the port (via $fwd_port) so Spring builds redirect_uri = http://localhost:30090/...
        # Sending X-Forwarded-Proto WITHOUT X-Forwarded-Port made Spring reset the port to
        # 80, collapsing redirect_uri to http://localhost and breaking OIDC login.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $fwd_port;
    }

    # BFF logout (POST /logout) → engly-be. Exact match: Spring's logoutUrl is "/logout"
    # (no trailing slash) and the SPA posts to "/logout"; a "/logout/" prefix location does
    # NOT match "/logout", so the POST fell through to the SPA fallback and 301'd instead of
    # logging out. "= /logout" routes that exact path to the backend.
    location = /logout {
        proxy_pass http://engly-be:8081;
        proxy_http_version 1.1;
        # engly-be honors forwarded headers, so host AND port must both be forwarded.
        # $http_host carries host:port (e.g. localhost:30090); X-Forwarded-Port supplies
        # the port (via $fwd_port) so Spring builds redirect_uri = http://localhost:30090/...
        # Sending X-Forwarded-Proto WITHOUT X-Forwarded-Port made Spring reset the port to
        # 80, collapsing redirect_uri to http://localhost and breaking OIDC login.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $fwd_port;
    }

    # SPA fallback: unknown client routes resolve to index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
